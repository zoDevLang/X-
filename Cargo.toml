[package]
name = "xp-lang"
version = "0.1.0"
edition = "2021"
authors = ["zoDevLang"]
description = "X+ (XP) Programming Language - A production-oriented systems language"

[[bin]]
name = "xp"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
